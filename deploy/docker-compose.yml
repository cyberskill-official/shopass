name: shopass

# Core value loop: scrape a price -> price_snapshot -> forecast -> deal alert -> notify -> web chart.
# Bring up:   cp deploy/.env.example deploy/.env   # set POSTGRES_PASSWORD
#             docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Smoke:      SCRAPE_SEED=100:555:777 docker compose -f deploy/docker-compose.yml --env-file deploy/.env run --rm scrapesvc
#
# Dev host ports (loopback only): gateway, web, and optional db.
# Application services are network-private; the gateway strips client X-User-*
# and sets verified identity from JWT (TASK-INFRA-006 / R1).
# POSTGRES_PASSWORD has no compose default — set it in deploy/.env.
# Do not publish this stack beyond loopback.

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-shopass}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopass}"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    image: postgres:16-alpine
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
    volumes:
      - ../db/migrations:/migrations/db:ro
      - ../services:/migrations/services:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  notifsvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/notif, CMD: ./cmd/notifsvc }
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      # Optional: leave unset locally to enqueue-only (dispatcher idle).
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  pricesvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/price, CMD: ./cmd/pricesvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      PRICE_ADDR: ":8081"
      # Local-only shared token for tracksvc -> pricesvc. Production requires
      # a distinct secret through docker-compose.production.yml.
      PRICE_INTERNAL_SERVICE_TOKEN: ${PRICE_INTERNAL_SERVICE_TOKEN:-dev-only-change-me}
    depends_on:
      migrate: { condition: service_completed_successfully }

  dealsvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/deal, CMD: ./cmd/dealsvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      NOTIFSVC_URL: http://notifsvc:8082/notify
      DEAL_ADDR: ":8082"  # serves the chart feed (FR-DEAL-003) read by the bff
    depends_on:
      migrate: { condition: service_completed_successfully }
      notifsvc: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      PRICE_API_BASE: http://pricesvc:8081
      GATEWAY_INTERNAL_BASE_URL: http://gateway:8080
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      pricesvc: { condition: service_started }
      gateway: { condition: service_started }

  authsvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/auth, CMD: ./cmd/authsvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      AUTH_ADDR: ":8084"
      AUTH_ISS: ${AUTH_ISS:-shopass-auth}
      AUTH_AUD: ${AUTH_AUD:-shopass-gateway}
      # Local-only social login requires an explicit opt-in. It is disabled in
      # the production topology until the BFF handles its callback.
      ENABLE_GOOGLE_OAUTH: ${ENABLE_GOOGLE_OAUTH:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  tracksvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/track, CMD: ./cmd/tracksvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      TRACK_ADDR: ":8083"
      PRICE_INTERNAL_URL: http://pricesvc:8081
      PRICE_INTERNAL_SERVICE_TOKEN: ${PRICE_INTERNAL_SERVICE_TOKEN:-dev-only-change-me}
      BILL_INTERNAL_URL: http://billsvc:8086
      BILL_INTERNAL_SERVICE_TOKEN: ${BILL_INTERNAL_SERVICE_TOKEN:-dev-only-bill-token}
    depends_on:
      migrate: { condition: service_completed_successfully }
      billsvc: { condition: service_started }

  billsvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/bill, CMD: ./cmd/billsvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      BILL_ADDR: ":8086"
      BILL_INTERNAL_SERVICE_TOKEN: ${BILL_INTERNAL_SERVICE_TOKEN:-dev-only-bill-token}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-}
      ZALOPAY_MAC_KEY: ${ZALOPAY_MAC_KEY:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  complysvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/comply, CMD: ./cmd/complysvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      COMPLY_ADDR: ":8087"
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Experimental GraphQL BFF (R18 decision b): not on the default data path.
  # Web uses same-origin /api/* + gateway /v1/* REST. Opt in:
  #   docker compose ... --profile bff up -d
  bff:
    profiles: ["bff"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args: { SERVICE: bff }
    environment:
      BFF_ADDR: ":8085"
      TRACK_BASE_URL: http://tracksvc:8083
      DEAL_BASE_URL: http://dealsvc:8082
    depends_on:
      tracksvc: { condition: service_started }
      dealsvc: { condition: service_started }

  # Sole API entrypoint on the host. Strips client X-User-* and sets verified
  # identity from JWT (JWKS from authsvc).
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/gateway, CMD: ./cmd/gateway }
    environment:
      GATEWAY_ADDR: ":8080"
      REDIS_URL: redis://redis:6379/0
      AUTH_JWKS_URL: http://authsvc:8084/.well-known/jwks.json
      AUTH_ISS: ${AUTH_ISS:-shopass-auth}
      AUTH_AUD: ${AUTH_AUD:-shopass-gateway}
      AUTH_UPSTREAM_URL: http://authsvc:8084
      TRACK_UPSTREAM_URL: http://tracksvc:8083
      PRICE_UPSTREAM_URL: http://pricesvc:8081
      DEAL_UPSTREAM_URL: http://dealsvc:8082
      NOTIF_UPSTREAM_URL: http://notifsvc:8082
      BILL_UPSTREAM_URL: http://billsvc:8086
      COMPLY_UPSTREAM_URL: http://complysvc:8087
      # Optional: only used when profile bff is up (R18).
      BFF_UPSTREAM_URL: ${BFF_UPSTREAM_URL:-}
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      redis: { condition: service_healthy }
      authsvc: { condition: service_started }
      tracksvc: { condition: service_started }
      pricesvc: { condition: service_started }
      dealsvc: { condition: service_started }
      notifsvc: { condition: service_started }
      billsvc: { condition: service_started }
      complysvc: { condition: service_started }

  # --- one-shot jobs: docker compose run --rm <name> ---
  # Live Shopee: set HTTPS_PROXY to a residential proxy (http.Client uses ProxyFromEnvironment).
  scrapesvc:
    profiles: ["jobs"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/scrape, CMD: ./cmd/scrapesvc }
    environment:
      SHOPEE_BASE_URL: ${SHOPEE_BASE_URL:-https://shopee.vn}
      PRICE_BASE_URL: http://pricesvc:8081
      PRICE_INTERNAL_SERVICE_TOKEN: ${PRICE_INTERNAL_SERVICE_TOKEN:-dev-only-change-me}
      SCRAPE_SEED: ${SCRAPE_SEED:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable  # durable queue (FR-SCRAPE-001)
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-pricesvc,db,localhost,127.0.0.1}
    depends_on:
      pricesvc: { condition: service_started }
    restart: "no"

  mlforecast:
    profiles: ["jobs"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ml
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

volumes:
  pgdata:
  redisdata:
