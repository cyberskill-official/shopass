name: shopass

# Core value loop: scrape a price -> price_snapshot -> forecast -> deal alert -> notify -> web chart.
# Bring up:   docker compose -f deploy/docker-compose.yml up -d --build
# Smoke:      SCRAPE_SEED=100:555:777 docker compose -f deploy/docker-compose.yml run --rm scrapesvc
#             (then see deploy/README.md for the full end-to-end acceptance check)

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shopass}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopass}"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    image: postgres:16-alpine
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
    volumes:
      - ../db/migrations:/migrations/db:ro
      - ../services:/migrations/services:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  notifsvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/notif, CMD: ./cmd/notifsvc }
    environment:
      PORT: "8082"
    depends_on:
      migrate: { condition: service_completed_successfully }

  pricesvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/price, CMD: ./cmd/pricesvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      PRICE_ADDR: ":8081"
    ports: ["${PRICE_PORT:-8081}:8081"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  dealsvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/deal, CMD: ./cmd/dealsvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      NOTIFSVC_URL: http://notifsvc:8082/notify
      DEAL_ADDR: ":8082"  # serves the chart feed (FR-DEAL-003) read by the bff
    ports: ["${DEAL_PORT:-8082}:8082"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      notifsvc: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      PRICE_API_BASE: http://pricesvc:8081
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      pricesvc: { condition: service_started }

  authsvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/auth, CMD: ./cmd/authsvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      AUTH_ADDR: ":8084"
      AUTH_ISS: ${AUTH_ISS:-shopass-auth}
      AUTH_AUD: ${AUTH_AUD:-shopass-gateway}
      # Social login (FR-AUTH-004) turns on only when GOOGLE_CLIENT_ID is set.
      # The secret comes from deploy/.env, never a code literal.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports: ["${AUTH_PORT:-8084}:8084"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  tracksvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/track, CMD: ./cmd/tracksvc }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
      TRACK_ADDR: ":8083"
    ports: ["${TRACK_PORT:-8083}:8083"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  bff:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      args: { SERVICE: bff }
    environment:
      BFF_ADDR: ":8085"
      TRACK_BASE_URL: http://tracksvc:8083
      DEAL_BASE_URL: http://dealsvc:8082
    ports: ["${BFF_PORT:-8085}:8085"]
    depends_on:
      tracksvc: { condition: service_started }
      dealsvc: { condition: service_started }

  # --- one-shot jobs: docker compose run --rm <name> ---
  scrapesvc:
    profiles: ["jobs"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      args: { SERVICE: services/scrape, CMD: ./cmd/scrapesvc }
    environment:
      SHOPEE_BASE_URL: ${SHOPEE_BASE_URL:-https://shopee.vn}
      PRICE_BASE_URL: http://pricesvc:8081
      SCRAPE_SEED: ${SCRAPE_SEED:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable  # durable queue (FR-SCRAPE-001)
    depends_on:
      pricesvc: { condition: service_started }
    restart: "no"

  mlforecast:
    profiles: ["jobs"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ml
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shopass}?sslmode=disable
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

volumes:
  pgdata:
