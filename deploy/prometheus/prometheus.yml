global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: shopass

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          service: gateway

  - job_name: authsvc
    metrics_path: /metrics
    static_configs:
      - targets: ["authsvc:8084"]
        labels:
          service: authsvc

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: blackbox-healthz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway:8080/healthz
          - http://authsvc:8084/healthz
          - http://pricesvc:8081/healthz
          - http://dealsvc:8082/healthz
          - http://tracksvc:8083/healthz
          - http://notifsvc:8082/healthz
          - http://billsvc:8086/healthz
          - http://complysvc:8087/healthz
        labels:
          probe: healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
