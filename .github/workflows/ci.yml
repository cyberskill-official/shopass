name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (gofmt + build + unit + integration)
    runs-on: ubuntu-latest
    # A real TimescaleDB is provided for the deal integration suite; the db module
    # spins up its own container via testcontainers (Docker is present on the runner).
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod declares go 1.25.0 (see docs/AUDIT-REPORT.md hygiene note).
          go-version: "1.25"
      - name: gofmt
        run: |
          set -e
          # Scope to tracked *.go sources only, excluding deploy/Dockerfile.go
          # (a Dockerfile named *.go — `gofmt -l .` falsely flags it).
          unformatted="$(git ls-files '*.go' | grep -v '^deploy/Dockerfile\.go$' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create test databases + composed schema
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          # deal integration needs the composed schema; price/scrape integration
          # tests DROP/CREATE their own tables, so give each its own database.
          for db in shopass_deal_test shopass_price_test shopass_scrape_test; do
            psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
          for f in db/migrations/*.up.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d shopass_deal_test -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d shopass_deal_test -f services/track/migrations/0003_alert_rule.sql
          for f in services/ml/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d shopass_deal_test -f "$f"
          done
          for f in services/deal/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d shopass_deal_test -f "$f"
          done
      - name: Test all Go modules
        run: |
          set -e
          dbfor() {
            case "$1" in
              services/deal)   echo shopass_deal_test ;;
              services/price)  echo shopass_price_test ;;
              services/scrape) echo shopass_scrape_test ;;
              *)               echo "" ;;
            esac
          }
          for mod in db obs region secrets \
                     services/gateway services/auth services/price services/scrape \
                     services/deal services/notif services/track services/cart \
                     services/affil services/bill services/comply; do
            db="$(dbfor "$mod")"; url=""
            [ -n "$db" ] && url="postgres://postgres:postgres@localhost:5432/$db?sslmode=disable"
            echo "== $mod (db=${db:-none}) =="
            # -p 1: run each module's package test binaries serially. Integration
            # suites in the same module share one database and would otherwise race
            # on shared tables (e.g. scrape feeder vs pgqueue on tracked_product).
            ( cd "$mod" && TEST_DB_URL="$url" go vet ./... && TEST_DB_URL="$url" go test -p 1 ./... )
          done

  frontend:
    name: Extension + Web (tsc + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Extension
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - name: Web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test

  bff:
    name: BFF (tsc + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: services/bff/package-lock.json
      - name: Install, typecheck, test
        working-directory: services/bff
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  scrape-farm:
    name: Scrape farm (tsc + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: services/scrape/farm/package-lock.json
      - name: Install, typecheck, test
        working-directory: services/scrape/farm
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx tsc --noEmit
          npm test

  ml:
    name: ml (pytest with Prophet + CmdStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Python deps
        working-directory: services/ml
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install CmdStan (needed for the Prophet fit test)
        run: |
          python - <<'PY'
          import os
          import cmdstanpy
          from prophet import Prophet

          cmdstanpy.install_cmdstan(overwrite=False)
          path = cmdstanpy.cmdstan_path()
          print(f"CMDSTAN={path}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"CMDSTAN={path}\n")
          # Fail the install step early if Prophet cannot bind CMDSTANPY.
          m = Prophet(stan_backend="CMDSTANPY")
          print("prophet_backend", type(m.stan_backend).__name__)
          PY
      - name: Test
        working-directory: services/ml
        env:
          PYTHONPATH: ${{ github.workspace }}/services/ml
        run: pytest tests/ -q

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate compose files
        env:
          # Config-only stubs — no images built; satisfies ${VAR:?...} interpolation.
          APP_DOMAIN: example.com
          ACME_EMAIL: ci@example.com
          DATABASE_URL: postgres://u:p@db:5432/shopass?sslmode=disable
          PRICE_INTERNAL_SERVICE_TOKEN: ci-token
          BILL_INTERNAL_SERVICE_TOKEN: ci-token
          APP_ORIGIN: https://example.com
          AUTH_KEY_ID: ci-key
          DB_PASSWORD_FILE: /tmp/ci-db-password
          AUTH_SIGNING_KEY_SECRET_FILE: /tmp/ci-auth-key
        run: |
          set -e
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config --quiet
          docker compose -f deploy/docker-compose.production.yml config --quiet
          # cyberos-shared is an overlay on production, not a standalone file
          docker compose -f deploy/docker-compose.production.yml \
            -f deploy/docker-compose.cyberos-shared.yml config --quiet
