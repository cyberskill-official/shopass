<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SănDeal — Cài đặt</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f8f9fa; color: #1a1a2e; padding: 2rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    .section { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .section h2 { font-size: 1rem; margin-bottom: .75rem; }
    .consent-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 0; border-bottom: 1px solid #f0f0f0;
    }
    .consent-row:last-child { border-bottom: none; }
    .toggle { position: relative; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #ccc; border-radius: 24px; transition: .2s;
    }
    .toggle .slider::before {
      content: ''; position: absolute; width: 18px; height: 18px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
      transition: .2s;
    }
    .toggle input:checked + .slider { background: #0d6efd; }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
    .link-dsar {
      color: #0d6efd; text-decoration: none; font-size: .9rem;
      display: inline-block; margin-top: .5rem;
    }
    #status { font-size: .85rem; color: #28a745; margin-top: .5rem; display: none; }
  </style>
</head>
<body>
  <h1>⚙️ Cài đặt SănDeal</h1>

  <div class="section">
    <h2>Quyền truy cập dữ liệu</h2>
    <div class="consent-row">
      <span>Đọc giỏ hàng</span>
      <label class="toggle">
        <input type="checkbox" id="set-read-cart">
        <span class="slider"></span>
      </label>
    </div>
    <div class="consent-row">
      <span>Đọc voucher</span>
      <label class="toggle">
        <input type="checkbox" id="set-read-voucher">
        <span class="slider"></span>
      </label>
    </div>
    <div class="consent-row">
      <span>Đồng bộ server</span>
      <label class="toggle">
        <input type="checkbox" id="set-sync-backend">
        <span class="slider"></span>
      </label>
    </div>
    <div id="status">✓ Đã lưu</div>
  </div>

  <div class="section">
    <h2>Quyền của bạn</h2>
    <a class="link-dsar" id="link-dsar" href="#">Yêu cầu xóa dữ liệu (DSAR)</a>
    <p style="font-size:.8rem; color:#888; margin-top:.25rem;">
      Liên kết tới quy trình xóa dữ liệu theo PDPL (FR-COMPLY-003)
    </p>
  </div>

  <script src="settings.js"></script>
</body>
</html>
